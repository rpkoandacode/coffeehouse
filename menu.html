<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | CoffeeHouse</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="color: inherit; text-decoration: none;">
                CoffeeHouse
            </a>
        </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html" class="cart-link">Cart (0)</a></li>
    </ul>
</nav>

</header>

<main>

<section class="featured reveal">

<div class="section-title">
    <span>Our Menu</span>
    <h2>Choose Your Favorite Drink</h2>
    <p>
        Freshly prepared coffee, non-coffee drinks, and delicious food.
    </p>
</div>

<div class="menu-filters">

    <button class="filter-btn active" data-category="All">
        All
    </button>

    <button class="filter-btn" data-category="Coffee">
        Coffee
    </button>

    <button class="filter-btn" data-category="Non Coffee">
        Non Coffee
    </button>

    <button class="filter-btn" data-category="Food">
        Food
    </button>

</div>

<div class="featured-grid" id="menu-grid"></div>

</section>

</main>

<!-- Product Customization Modal -->

<div class="modal-overlay" id="product-modal">

<div class="modal">

    <div class="modal-header">

        <h2 id="modal-title">Customize Drink</h2>

        <button id="close-modal">&times;</button>

    </div>

    <div class="modal-content">

        <div class="option-group" id="size-section">

    <label>Size</label>

    <div class="option-buttons" data-option="size">

        <button class="option-btn active" data-value="Regular">
            Regular
        </button>

        <button class="option-btn" data-value="Large">
            Large (+Rp 3.000)
        </button>

    </div>

</div>

        <div class="option-group">

            <label>Temperature</label>

            <div class="option-buttons" data-option="temperature">

                <button class="option-btn active" data-value="Ice">
                    Ice
                </button>

                <button class="option-btn" data-value="Hot">
                    Hot
                </button>

            </div>

        </div>

        <div class="option-group">

            <label>Sugar Level</label>

            <div class="option-buttons" data-option="sugar">

                <button class="option-btn" data-value="No sugar">
                    No sugar
                </button>

                <button class="option-btn" data-value="30%">
                    30%
                </button>

                <button class="option-btn active" data-value="Less sugar (50%)">
                    Less sugar (50%)
                </button>

                <button class="option-btn" data-value="Normal sugar (100%)">
                    Normal sugar (100%)
                </button>

            </div>

        </div>

        <div class="option-group">

            <label>Ice Level</label>

            <div class="option-buttons" data-option="ice">

                <button class="option-btn active" data-value="Normal ice">
                    Normal ice
                </button>

                <button class="option-btn" data-value="Less ice">
                    Less ice
                </button>

            </div>

        </div>

        <div class="option-group" id="milk-section">

            <label>Milk Option</label>

            <div class="option-buttons" data-option="milk">

                <button class="option-btn active" data-value="Regular cow milk">
                    Regular cow milk
                </button>

                <button class="option-btn" data-value="Oat milk">
                    Oat milk
                </button>

                <button class="option-btn" data-value="Soy milk">
                    Soy milk
                </button>

            </div>

        </div>

        <button id="confirm-add" class="btn">
            Add to Cart
        </button>

    </div>

</div>

</div>

<script src="js/data.js"></script>

<script src="js/cart.js"></script>

<script src="js/menu.js"></script>

<script src="js/script.js"></script>

</body>
</html>
