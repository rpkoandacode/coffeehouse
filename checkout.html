<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | CoffeeHouse</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">


</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="color: inherit; text-decoration: none;">
                CoffeeHouse
            </a>
        </div>


    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html" class="cart-link">Cart (0)</a></li>
    </ul>
</nav>

</header>

<main>

<section class="checkout">

<div class="checkout-form">

    <h2>Customer Information</h2>

    <label>Full Name</label>
    <input type="text" id="customer-name" placeholder="Enter your name">

    <label>Phone Number</label>
    <input type="tel" id="customer-phone" placeholder="08xxxxxxxxxx">

    <label>Order Type</label>
    <select id="order-type">
        <option>Pickup</option>
        <option>Dine In</option>
    </select>

    <label>Pickup Time</label>
    <input type="time" id="pickup-time">

    <label>Special Notes</label>
    <textarea id="order-notes" placeholder="Any special request?"></textarea>

</div>

<div class="checkout-summary">

    <h2>Order Summary</h2>

    <div id="checkout-items"></div>

    <div id="checkout-total"></div>

    <button id="place-order-btn" class="btn">
        Place Order
    </button>

</div>

</section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>

<script src="js/firebase.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
